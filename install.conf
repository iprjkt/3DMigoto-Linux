# ==============================================================================
# 3DMigoto-Linux Configuration File
# ==============================================================================
# Used by install.sh to track Wine/Proton prefix directories, game directories,
# DXVK paths, and model importer package repositories (GIMI / SRMI / ZZMI).
#
# Deployment layout:
# - d3d11.dll & original_d3d11.dll (DXVK) -> <prefix>/drive_c/windows/system32/
# - d3dcompiler_47.dll, Core/, ShaderFixes/, Mods/, d3dx.ini -> <game_dir>/
#
# Notes:
# - Paths containing spaces do not require quotes.
# - Supports ~ and $HOME expansion (e.g. ~/.local/share/anime-game-launcher/prefix).
# - CLI flags (--game-dir, --prefix, --dxvk, etc.) override values in this file.
# ==============================================================================

[Global]
# Optional: Custom paths to 3DMigoto d3d11.dll and native d3dcompiler_47.dll.
# Leave empty to auto-detect from the script directory or build/ folder.
d3d11_path =
d3dcompiler_path =

# Default Wine/Proton prefix directory (used when a per-game prefix is empty)
default_prefix =

# Default path to 64-bit DXVK d3d11.dll (used when per-game dxvk is empty)
default_dxvk =

# Default installer behavior (0 = disabled, 1 = enabled)
keep_ini = 0
update_dll_only = 0

# ==============================================================================
# Game Profiles
# Run a single profile with : bash install.sh -g <section_name>
# Run all enabled=1 profiles: bash install.sh --all
# ==============================================================================

[GIMI]
enabled = 0
# Example: /path/to/Genshin Impact game
game_dir =
# Example: ~/.local/share/anime-game-launcher/prefix
prefix =
# Example: ~/.local/share/anime-game-launcher/dxvks/dxvk-3.0/x64/d3d11.dll
dxvk =
repo = https://github.com/SilentNightSound/GIMI-Package.git
exe = GenshinImpact.exe
keep_ini =

[SRMI]
enabled = 0
# Example: /path/to/Honkai Star Rail/Games
game_dir =
# Example: ~/.local/share/honkers-railway-launcher/prefix
prefix =
dxvk =
repo = https://github.com/SpectrumQT/SRMI-Package.git
exe = StarRail.exe
keep_ini =

[ZZMI]
enabled = 0
# Example: /path/to/ZenlessZoneZero Game
game_dir =
# Example: ~/.local/share/sleepy-launcher/prefix
prefix =
dxvk =
repo = https://github.com/leotorrez/ZZMI-Package.git
exe = ZenlessZoneZero.exe
keep_ini =
